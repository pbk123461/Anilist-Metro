<!-- SECTION 0: START -->
        <section class="header-section">
            <div class="content-scroll">
                <div class="start-screen-toolbar">
                    <button class="metro-btn small" type="button" id="start-tile-edit-btn" onclick="toggleTileEditMode()">
                        <i class="fa-solid fa-pen"></i> edit tiles
                    </button>
                    <span id="start-tile-edit-help" class="start-tile-edit-help">drag to reorder tiles or manage tiles</span>
                </div>
                <div class="start-screen-grid">
                    <div class="metro-tile-start tile wide profile-tile" data-role="live-tile" data-effect="slideUp" data-period="7200" data-live-tile="profile" data-tile-default="true" style="background-color: var(--surface);"
                        onclick="scrollToSection(1)">
                        <img id="start-tile-avatar"
                            src="https://s4.anilist.co/file/anilistcdn/user/avatar/large/default.png"
                            onerror="this.onerror=null; this.src='https://s4.anilist.co/file/anilistcdn/user/avatar/large/default.png';"
                            alt="Avatar">
                        <div class="start-title" id="start-tile-user"
                            style="padding: 10px; background: var(--wallpaper-overlay); width: 100%;">guest</div>
                    </div>
                    <div class="metro-tile-start tile medium" data-role="live-tile" data-effect="slideUp" data-period="7200" data-live-tile="library" data-tile-default="true" style="background-color: #60a917;"
                        onclick="scrollToSection(2)">
                        <i class="fa-solid fa-book-open start-icon"></i>
                        <span class="start-title">library</span>
                    </div>
                    <div class="metro-tile-start tile medium" data-role="live-tile" data-effect="slideUp" data-period="7200" data-live-tile="discover" data-tile-default="true" style="background-color: #f39c12;"
                        onclick="scrollToSection(4)">
                        <i class="fa-solid fa-magnifying-glass start-icon"></i>
                        <span class="start-title">discover</span>
                    </div>
                    <div class="metro-tile-start tile medium" data-role="live-tile" data-effect="slideUp" data-period="7200" data-live-tile="inbox" data-tile-default="true" style="background-color: #d80073;"
                        onclick="scrollToSection(6)">
                        <span class="start-title"
                            style="font-size: 4rem; align-self: center; margin: auto; font-weight: 200; line-height: 1;"
                            id="start-tile-notif">0</span>
                        <span class="start-title">inbox</span>
                    </div>
                    <div class="metro-tile-start tile wide" data-role="live-tile" data-effect="slideUp" data-period="7200" data-live-tile="community" data-tile-default="true" style="background-color: #a20025;" onclick="scrollToSection(3)">
                        <i class="fa-solid fa-users start-icon"></i>
                        <span class="start-title">community</span>
                    </div>
                </div>
                <aside id="start-tile-editor" class="start-tile-editor" aria-hidden="true">
                    <div class="start-tile-editor-header">
                        <div>
                            <div class="start-tile-editor-title">edit tiles</div>
                            <div class="start-tile-editor-sub">manage default and optional anilist tiles</div>
                        </div>
                        <div class="start-tile-editor-actions">
                            <button class="metro-btn small" type="button" onclick="restoreDefaultTiles()">restore defaults</button>
                            <button class="metro-btn small" type="button" onclick="toggleTileEditMode()">done</button>
                        </div>
                    </div>
                    <div class="start-tile-options" aria-label="manage default tiles">
                        <button class="start-tile-option" type="button" data-tile-option="profile" onclick="toggleStartTile('profile')"><i class="fa-solid fa-user"></i><span>profile</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="library" onclick="toggleStartTile('library')"><i class="fa-solid fa-book-open"></i><span>library</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="discover" onclick="toggleStartTile('discover')"><i class="fa-solid fa-magnifying-glass"></i><span>discover</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="inbox" onclick="toggleStartTile('inbox')"><i class="fa-solid fa-envelope"></i><span>inbox</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="community" onclick="toggleStartTile('community')"><i class="fa-solid fa-users"></i><span>community</span></button>
                    </div>
                    <div class="start-tile-options" aria-label="add new tiles">
                        <button class="start-tile-option" type="button" data-tile-option="airing" onclick="toggleOptionalTile('airing')"><i class="fa-solid fa-calendar-days"></i><span>add airing today</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="watching" onclick="toggleOptionalTile('watching')"><i class="fa-solid fa-play"></i><span>add currently watching</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="quick-search" onclick="toggleOptionalTile('quick-search')"><i class="fa-solid fa-magnifying-glass"></i><span>add quick search</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="random" onclick="toggleOptionalTile('random')"><i class="fa-solid fa-shuffle"></i><span>add random anime</span></button>
                        <button class="start-tile-option" type="button" data-tile-option="unread" onclick="toggleOptionalTile('unread')"><i class="fa-solid fa-envelope"></i><span>add unread notifications</span></button>
                    </div>
                </aside>
            </div>
        </section>
